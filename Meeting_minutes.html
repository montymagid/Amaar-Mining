<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amaar Mining – Meeting Minutes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --gold:       #B8860B;
  --gold-light: #D4A520;
  --gold-pale:  #F5E6B8;
  --gold-dim:   #7A5A08;
  --gold-muted: rgba(184,134,11,0.12);
  --ink:        #141412;
  --ink2:       #1E1D1A;
  --ink3:       #2E2D2A;
  --slate:      #4A4845;
  --mid:        #8A8880;
  --line:       #E2DDD5;
  --line2:      #CBC5B8;
  --bg:         #F0EBE1;
  --bg2:        #F8F5EF;
  --bg3:        #FFFFFF;
  --sidebar-w:  290px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.page-wrap {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--ink);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(184,134,11,0.3) transparent;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.3); border-radius: 2px; }

/* Brand */
.sidebar-brand {
  padding: 24px 22px 20px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.brand-logo-upload {
  width: 46px;
  height: 46px;
  border: 1px dashed rgba(184,134,11,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: border-color .2s, background .2s;
  overflow: hidden;
  border-radius: 2px;
}
.brand-logo-upload:hover { border-color: var(--gold-light); background: rgba(184,134,11,.06); }
.brand-logo-upload input { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
.brand-logo-upload img { width:100%;height:100%;object-fit:contain; }
.brand-logo-placeholder { font-size: 20px; color: var(--gold); pointer-events: none; line-height: 1; }
.brand-text { overflow: hidden; }
.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 600;
  color: #FFF;
  letter-spacing: .3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-sub {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-top: 2px;
}

/* Section labels */
.sidebar-section {
  padding: 18px 22px 14px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  flex-shrink: 0;
}
.sidebar-section-label {
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,.25);
  margin-bottom: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.07);
}

/* Fields */
.field-group { margin-bottom: 11px; }
.field-group:last-child { margin-bottom: 0; }
.field-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  display: block;
  margin-bottom: 5px;
}
.field-input {
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 2px;
  color: rgba(255,255,255,.9);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  transition: border-color .2s, background .2s;
  appearance: none;
  -webkit-appearance: none;
}
.field-input:focus {
  border-color: rgba(184,134,11,.6);
  background: rgba(184,134,11,.06);
}
.field-input::placeholder { color: rgba(255,255,255,.2); font-size: 12px; }
.field-input option { background: var(--ink2); color: #fff; }
.field-input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.4); cursor: pointer; }
.field-input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.4); cursor: pointer; }

/* Attendees */
.attendees-list { display: flex; flex-direction: column; gap: 5px; }
.attendee-row { display: flex; gap: 5px; align-items: center; }
.attendee-row .field-input { flex: 1; font-size: 12px; padding: 7px 9px; }
.attendee-role-input { width: 72px !important; flex-shrink: 0 !important; flex: none !important; font-size: 11px !important; }
.btn-icon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  background: transparent;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 2px;
  color: rgba(255,255,255,.3);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.btn-icon.danger:hover { border-color: rgba(200,80,80,.6); color: #E07070; background: rgba(200,80,80,.08); }
.btn-add-row {
  background: transparent;
  border: 1px dashed rgba(184,134,11,.3);
  border-radius: 2px;
  color: rgba(184,134,11,.5);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 7px;
  width: 100%;
  cursor: pointer;
  transition: all .2s;
  margin-top: 6px;
}
.btn-add-row:hover {
  border-color: rgba(184,134,11,.7);
  color: var(--gold);
  background: rgba(184,134,11,.05);
}

/* Sidebar actions */
.sidebar-actions { padding: 18px 22px 22px; margin-top: auto; flex-shrink: 0; }
.btn-generate {
  width: 100%;
  background: var(--gold);
  color: var(--ink);
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 13px;
  cursor: pointer;
  letter-spacing: .5px;
  transition: background .2s, transform .1s;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-generate:hover { background: var(--gold-light); }
.btn-generate:active { transform: scale(.98); }
.btn-clear {
  width: 100%;
  margin-top: 8px;
  background: transparent;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 2px;
  color: rgba(255,255,255,.3);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 9px;
  cursor: pointer;
  transition: all .2s;
}
.btn-clear:hover { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.6); }

/* ── MAIN EDITOR ── */
.main-editor {
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.editor-topbar {
  background: var(--bg3);
  border-bottom: 1px solid var(--line);
  padding: 13px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 1px 0 var(--line), 0 4px 16px rgba(0,0,0,.04);
}
.topbar-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: .3px;
}
.topbar-title span { color: var(--gold); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.btn-topbar {
  background: transparent;
  border: 1px solid var(--line2);
  border-radius: 2px;
  color: var(--slate);
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 9px 18px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 7px;
}
.btn-topbar:hover { border-color: var(--ink); color: var(--ink); }
.btn-topbar-gold {
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 9px 18px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 7px;
}
.btn-topbar-gold:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }

.editor-body { padding: 36px 32px 60px; flex: 1; }

/* Items header */
.items-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.items-header h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}
.items-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: var(--gold);
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
  border-radius: 50%;
  margin-left: 8px;
  vertical-align: middle;
  transition: all .2s;
}
.btn-add-item {
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 18px;
  cursor: pointer;
  transition: background .2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-add-item:hover { background: var(--gold); color: var(--ink); }

/* Agenda cards */
.agenda-items { display: flex; flex-direction: column; gap: 12px; }
.agenda-card {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-left: 3px solid var(--gold);
  border-radius: 2px;
  transition: box-shadow .2s, border-left-color .2s;
  animation: slideIn .22s ease forwards;
  overflow: hidden;
}
@keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
.agenda-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,.07); }
.card-header {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  cursor: grab;
  user-select: none;
}
.card-header:active { cursor: grabbing; }
.item-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  min-width: 22px;
  flex-shrink: 0;
}
.drag-handle { color: var(--line2); font-size: 14px; flex-shrink: 0; cursor: grab; }
.card-title-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  outline: none;
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
  padding: 1px 0;
  min-width: 0;
}
.card-title-input:focus { border-bottom-color: var(--gold); }
.card-title-input::placeholder { color: var(--mid); font-weight: 400; }
.status-select {
  background: transparent;
  border: 1px solid var(--line2);
  border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--slate);
  padding: 4px 8px;
  outline: none;
  cursor: pointer;
  transition: border-color .2s;
  flex-shrink: 0;
  appearance: none;
}
.status-select:focus { border-color: var(--gold); }
.card-remove {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--line2);
  font-size: 20px;
  line-height: 1;
  padding: 2px 4px;
  transition: color .2s;
  flex-shrink: 0;
}
.card-remove:hover { color: #C04040; }

.card-body { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 13px; }
.card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.field-label-editor {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--mid);
  display: block;
  margin-bottom: 5px;
}
.input-editor {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 2px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--ink);
  padding: 8px 10px;
  outline: none;
  transition: border-color .2s, background .2s;
}
.input-editor:focus { border-color: var(--gold); background: #FFF; }
.input-editor::placeholder { color: var(--mid); }
textarea.input-editor { resize: vertical; line-height: 1.65; }

/* Action items */
.action-items-mini { margin-top: 2px; }
.action-items-mini-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-items-mini-label::after { content:''; flex:1; height:1px; background:var(--line); }
.action-row {
  display: grid;
  grid-template-columns: 1fr 140px 120px 28px;
  gap: 6px;
  align-items: center;
  margin-bottom: 5px;
}
.action-row .input-editor { font-size: 12px; padding: 6px 9px; }
.btn-add-action {
  background: transparent;
  border: 1px dashed rgba(184,134,11,.3);
  border-radius: 2px;
  color: rgba(184,134,11,.5);
  font-family: 'DM Sans', sans-serif;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 6px;
  width: 100%;
  cursor: pointer;
  transition: all .2s;
  margin-top: 4px;
}
.btn-add-action:hover { border-color: rgba(184,134,11,.7); color: var(--gold); background: rgba(184,134,11,.04); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 64px 20px;
  color: var(--mid);
  border: 1px dashed var(--line2);
  border-radius: 2px;
  background: var(--bg3);
}
.empty-state .icon { font-size: 40px; margin-bottom: 14px; opacity: .35; }
.empty-state p { font-size: 14px; line-height: 1.8; color: var(--mid); }
.empty-state strong { color: var(--gold); font-weight: 600; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .5px;
  padding: 12px 20px;
  border-left: 3px solid var(--gold);
  border-radius: 2px;
  transform: translateX(140px);
  opacity: 0;
  transition: all .3s ease;
  z-index: 9999;
  pointer-events: none;
}
#toast.show { transform: translateX(0); opacity: 1; }

/* ── LOADING ── */
#loading {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20,20,18,.78);
  z-index: 9998;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  backdrop-filter: blur(3px);
}
#loading.show { display: flex; }
.spinner {
  width: 34px;
  height: 34px;
  border: 2px solid rgba(184,134,11,.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p {
  color: rgba(255,255,255,.7);
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .page-wrap { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .editor-body { padding: 24px 16px 48px; }
  .card-row { grid-template-columns: 1fr; }
  .action-row { grid-template-columns: 1fr 100px; }
  .action-row .input-editor:nth-child(3) { display: none; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   PDF DOCUMENT STYLES
   All rules scoped inside #pdf-content
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#pdf-content {
  display: none;
  font-family: 'DM Sans', sans-serif;
  background: #ffffff;
  color: #1A1816;
  width: 210mm;
  margin: 0;
  padding: 0;
  line-height: 1.5;
  font-size: 11px;
}

/* Each PDF page wrapper */
.pdf-page {
  width: 210mm;
  min-height: 297mm;
  padding: 16mm 18mm 14mm;
  background: #ffffff;
  position: relative;
  page-break-after: always;
  box-sizing: border-box;
}
.pdf-page:last-child { page-break-after: auto; }

/* Watermark stripe on left */
.pdf-page::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: #B8860B;
}

/* PDF Header — compact, tight to the top */
.pdf-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 11px;
  margin-bottom: 13px;
  border-bottom: 1.5px solid #B8860B;
}
.pdf-brand-block { display: flex; align-items: center; gap: 11px; }
.pdf-logo-img {
  height: 42px;
  width: auto;
  max-width: 130px;
  object-fit: contain;
  display: block;
  flex-shrink: 0;
}
.pdf-logo-placeholder {
  width: 42px;
  height: 42px;
  background: #F0EBE1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #B8860B;
  flex-shrink: 0;
  border: 1px solid #E2DDD5;
}
.pdf-brand-text {}
.pdf-company-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 700;
  color: #1A1816;
  letter-spacing: .3px;
  line-height: 1.2;
}
.pdf-company-sub {
  font-size: 7.5px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #B8860B;
  margin-top: 2px;
}
.pdf-doc-label { text-align: right; }
.pdf-doc-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 700;
  color: #B8860B;
  text-transform: uppercase;
  letter-spacing: 1px;
  line-height: 1.2;
}
.pdf-doc-date { font-size: 10px; color: #8A8880; margin-top: 4px; }
.pdf-doc-ref  { font-size: 9px;  color: #B8860B; margin-top: 2px; font-weight: 600; letter-spacing: .5px; }

/* Meeting title — right under header, no gap */
.pdf-meeting-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 700;
  color: #1A1816;
  letter-spacing: .3px;
  margin-bottom: 12px;
  line-height: 1.25;
}

/* Meta grid */
.pdf-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid #E2DDD5;
  margin-bottom: 14px;
}
.pdf-meta-cell {
  padding: 8px 12px;
  border-right: 1px solid #E2DDD5;
}
.pdf-meta-cell:nth-child(3n) { border-right: none; }
.pdf-meta-cell:nth-child(n+4) { border-top: 1px solid #E2DDD5; }
.pdf-meta-label {
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #8A8880;
  margin-bottom: 3px;
}
.pdf-meta-value {
  font-size: 11px;
  font-weight: 600;
  color: #1A1816;
  line-height: 1.4;
}

/* Section heading */
.pdf-section-heading {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #B8860B;
  border-bottom: 1px solid #B8860B;
  padding-bottom: 4px;
  margin-bottom: 9px;
  margin-top: 14px;
}

/* Attendees */
.pdf-attendees-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px 14px;
  margin-bottom: 4px;
}
.pdf-attendee-item {
  font-size: 10px;
  color: #3A3835;
  padding: 3px 0;
  border-bottom: 1px dotted #E8E4DC;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pdf-attendee-item::before {
  content: '';
  width: 4px;
  height: 4px;
  background: #B8860B;
  flex-shrink: 0;
  display: inline-block;
}

/* Agenda items in PDF */
.pdf-agenda-item {
  margin-bottom: 12px;
  border: 1px solid #E2DDD5;
  border-left: 3px solid #B8860B;
  page-break-inside: avoid;
  break-inside: avoid;
}
.pdf-item-header {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #F8F5EF;
  padding: 7px 12px;
  border-bottom: 1px solid #E2DDD5;
}
.pdf-item-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  font-weight: 700;
  color: #B8860B;
  min-width: 20px;
  flex-shrink: 0;
}
.pdf-item-title {
  font-size: 12px;
  font-weight: 600;
  color: #1A1816;
  flex: 1;
  line-height: 1.35;
}
.pdf-item-status {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 2px 7px;
  border: 1px solid;
  flex-shrink: 0;
  white-space: nowrap;
}
.status-discussed { color: #2A6A2A; border-color: #2A6A2A; background: #F0FFF0; }
.status-pending   { color: #8B6914; border-color: #8B6914; background: #FFFAF0; }
.status-deferred  { color: #6A2A2A; border-color: #6A2A2A; background: #FFF0F0; }
.status-approved  { color: #1A4A7A; border-color: #1A4A7A; background: #F0F4FF; }
.status-info      { color: #6A6860; border-color: #C8C4BC; background: #F5F3EF; }

.pdf-item-body {
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pdf-item-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pdf-field-label {
  font-size: 7.5px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #8A8880;
  margin-bottom: 2px;
}
.pdf-field-value {
  font-size: 10.5px;
  color: #3A3835;
  line-height: 1.5;
  word-break: break-word;
  overflow-wrap: break-word;
}

/* Action items table */
.pdf-action-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 9.5px;
  margin-top: 3px;
  table-layout: fixed;
}
.pdf-action-table th {
  background: #1A1816;
  color: #fff;
  font-size: 7.5px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 9px;
  text-align: left;
}
.pdf-action-table th:first-child { width: auto; }
.pdf-action-table th:nth-child(2) { width: 130px; }
.pdf-action-table th:nth-child(3) { width: 90px; }
.pdf-action-table td {
  padding: 5px 9px;
  border-bottom: 1px solid #EFEBE3;
  color: #3A3835;
  vertical-align: top;
  word-break: break-word;
  overflow-wrap: break-word;
}
.pdf-action-table tr:last-child td { border-bottom: none; }
.pdf-action-table tr:nth-child(even) td { background: #F8F5EF; }

/* Continuation header (shown on pages 2+) */
.pdf-cont-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 9px;
  margin-bottom: 12px;
  border-bottom: 1.5px solid #B8860B;
}
.pdf-cont-brand { display: flex; align-items: center; gap: 9px; }
.pdf-cont-logo-img { height: 30px; width: auto; max-width: 90px; object-fit: contain; }
.pdf-cont-logo-placeholder {
  width: 30px; height: 30px;
  background: #F0EBE1;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #B8860B;
  border: 1px solid #E2DDD5;
  flex-shrink: 0;
}
.pdf-cont-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; font-weight: 700; color: #1A1816;
}
.pdf-cont-sub { font-size: 7px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #B8860B; margin-top: 1px; }
.pdf-cont-right { text-align: right; }
.pdf-cont-label { font-size: 10px; font-weight: 600; color: #B8860B; letter-spacing: .5px; font-family: 'Cormorant Garamond', serif; }
.pdf-cont-date { font-size: 9px; color: #8A8880; margin-top: 2px; }

/* Footer */
.pdf-footer {
  position: absolute;
  bottom: 11mm;
  left: 18mm;
  right: 18mm;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 7px;
  border-top: 1px solid #E2DDD5;
  font-size: 8px;
  color: #8A8880;
  letter-spacing: .5px;
}
.pdf-footer-brand { color: #B8860B; font-weight: 700; letter-spacing: 2px; font-size: 8px; }
.pdf-footer-center { font-size: 8px; color: #8A8880; }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo-upload" id="logo-upload-trigger" title="Click to upload logo">
        <input type="file" id="logo-file" accept="image/*">
        <div id="logo-display">
          <div class="brand-logo-placeholder">⬡</div>
        </div>
      </div>
      <div class="brand-text">
        <div class="brand-name">Amaar Mining</div>
        <div class="brand-sub">Minutes System</div>
      </div>
    </div>

    <!-- Meeting Details -->
    <div class="sidebar-section">
      <div class="sidebar-section-label">Meeting Details</div>
      <div class="field-group">
        <label class="field-label">Meeting Title</label>
        <input class="field-input" type="text" id="mtg-title" placeholder="e.g. Weekly Site Review">
      </div>
      <div class="field-group">
        <label class="field-label">Meeting Type</label>
        <select class="field-input" id="mtg-type">
          <option value="">Select type…</option>
          <option>Board Meeting</option>
          <option>Site Review</option>
          <option>Safety Briefing</option>
          <option>Exploration Review</option>
          <option>Project Update</option>
          <option>Management Meeting</option>
          <option>Technical Meeting</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Date</label>
        <input class="field-input" type="date" id="mtg-date">
      </div>
      <div class="field-group">
        <label class="field-label">Time</label>
        <input class="field-input" type="time" id="mtg-time">
      </div>
      <div class="field-group">
        <label class="field-label">Location / Platform</label>
        <input class="field-input" type="text" id="mtg-location" placeholder="e.g. Board Room A / Zoom">
      </div>
      <div class="field-group">
        <label class="field-label">Ref. No.</label>
        <input class="field-input" type="text" id="mtg-ref" placeholder="e.g. MIN-2025-042">
      </div>
    </div>

    <!-- Roles -->
    <div class="sidebar-section">
      <div class="sidebar-section-label">Roles</div>
      <div class="field-group">
        <label class="field-label">Chairperson</label>
        <input class="field-input" type="text" id="mtg-chair" placeholder="Name & Title">
      </div>
      <div class="field-group">
        <label class="field-label">Minutes Recorded By</label>
        <input class="field-input" type="text" id="mtg-recorder" placeholder="Name & Title">
      </div>
    </div>

    <!-- Attendees -->
    <div class="sidebar-section">
      <div class="sidebar-section-label">Attendees</div>
      <div class="attendees-list" id="attendees-list"></div>
      <button class="btn-add-row" id="btn-add-attendee">+ Add Attendee</button>
    </div>

    <!-- Actions -->
    <div class="sidebar-actions">
      <button class="btn-generate" id="btn-generate">
        <span>↓</span> Generate PDF
      </button>
      <button class="btn-clear" id="btn-clear">Clear Everything</button>
    </div>
  </aside>

  <!-- ── MAIN EDITOR ── -->
  <main class="main-editor">
    <div class="editor-topbar">
      <div class="topbar-title">Meeting <span>Minutes</span></div>
      <div class="topbar-actions">
        <button class="btn-topbar" id="btn-print">🖨 Print</button>
        <!-- <button class="btn-topbar-gold" id="btn-pdf-top">↓ Download PDF</button> -->
      </div>
    </div>
    <div class="editor-body">
      <div class="items-header">
        <h2>Agenda Items <span class="items-count" id="items-count">0</span></h2>
        <button class="btn-add-item" id="btn-add-item">+ Add Item</button>
      </div>
      <div class="agenda-items" id="agenda-items">
        <div class="empty-state" id="empty-state">
          <div class="icon">📋</div>
          <p>No agenda items yet.<br>Click <strong>+ Add Item</strong> to begin recording the meeting.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Hidden PDF element -->
<div id="pdf-content"></div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div><p>Generating PDF…</p></div>

<script>
// ── STATE ──
let logoDataUrl = null;
let attendees = [];
let agendaItems = [];
let attendeeIdCtr = 0;
let itemIdCtr = 0;
let dragSrcId = null;

// ── INIT ──
document.getElementById('mtg-date').valueAsDate = new Date();
document.getElementById('mtg-time').value = new Date().toTimeString().slice(0, 5);
addAttendee(); addAttendee(); addAttendee();
renderAttendees();

// ── LOGO UPLOAD ──
document.getElementById('logo-file').addEventListener('change', function () {
  if (!this.files || !this.files[0]) return;
  const fr = new FileReader();
  fr.onload = function (e) {
    logoDataUrl = e.target.result;
    const display = document.getElementById('logo-display');
    display.innerHTML = '';
    const img = document.createElement('img');
    img.src = logoDataUrl;
    img.style.cssText = 'width:44px;height:44px;object-fit:contain;';
    display.appendChild(img);
  };
  fr.readAsDataURL(this.files[0]);
});

// ── ATTENDEES ──
document.getElementById('btn-add-attendee').addEventListener('click', function () {
  addAttendee(); renderAttendees();
});

function addAttendee() {
  attendees.push({ id: ++attendeeIdCtr, name: '', role: '' });
}

function renderAttendees() {
  const list = document.getElementById('attendees-list');
  list.innerHTML = '';
  attendees.forEach(function (a) {
    const row = document.createElement('div');
    row.className = 'attendee-row';

    const nameInput = document.createElement('input');
    nameInput.className = 'field-input';
    nameInput.type = 'text';
    nameInput.placeholder = 'Name';
    nameInput.value = a.name;
    nameInput.style.cssText = 'font-size:12px;padding:7px 9px;flex:1;';
    nameInput.addEventListener('input', function () { a.name = this.value; });

    const roleInput = document.createElement('input');
    roleInput.className = 'field-input attendee-role-input';
    roleInput.type = 'text';
    roleInput.placeholder = 'Role';
    roleInput.value = a.role;
    roleInput.style.cssText = 'font-size:11px;padding:7px 8px;width:70px;flex-shrink:0;';
    roleInput.addEventListener('input', function () { a.role = this.value; });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn-icon danger';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = 'Remove';
    removeBtn.addEventListener('click', function () {
      attendees = attendees.filter(function (x) { return x.id !== a.id; });
      renderAttendees();
    });

    row.appendChild(nameInput);
    row.appendChild(roleInput);
    row.appendChild(removeBtn);
    list.appendChild(row);
  });
}

// ── AGENDA ITEMS ──
document.getElementById('btn-add-item').addEventListener('click', function () { addAgendaItem(); });

function addAgendaItem() {
  agendaItems.push({
    id: ++itemIdCtr,
    title: '', presenter: '', timeAlloc: '',
    discussion: '', decision: '', status: 'Discussed',
    actionItems: []
  });
  renderAgendaItems();
}

function updateItemCount() {
  document.getElementById('items-count').textContent = agendaItems.length;
}

function renderAgendaItems() {
  updateItemCount();
  const container = document.getElementById('agenda-items');
  container.innerHTML = '';

  if (agendaItems.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No agenda items yet.<br>Click <strong>+ Add Item</strong> to begin recording the meeting.</p></div>';
    return;
  }

  agendaItems.forEach(function (item, idx) {
    const card = document.createElement('div');
    card.className = 'agenda-card';
    card.dataset.id = item.id;

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';
    header.draggable = true;

    const numSpan = document.createElement('span');
    numSpan.className = 'item-num';
    numSpan.textContent = String(idx + 1).padStart(2, '0');

    const dragHandle = document.createElement('span');
    dragHandle.className = 'drag-handle';
    dragHandle.innerHTML = '⠿';
    dragHandle.title = 'Drag to reorder';

    const titleInput = document.createElement('input');
    titleInput.className = 'card-title-input';
    titleInput.type = 'text';
    titleInput.placeholder = 'Agenda item title…';
    titleInput.value = item.title;
    titleInput.addEventListener('input', function () { item.title = this.value; });

    const statusSelect = document.createElement('select');
    statusSelect.className = 'status-select';
    ['Discussed', 'Pending', 'Deferred', 'Approved', 'For Information'].forEach(function (s) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      if (item.status === s) opt.selected = true;
      statusSelect.appendChild(opt);
    });
    statusSelect.addEventListener('change', function () { item.status = this.value; });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'card-remove';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = 'Remove item';
    removeBtn.addEventListener('click', function () {
      agendaItems = agendaItems.filter(function (x) { return x.id !== item.id; });
      renderAgendaItems();
    });

    header.appendChild(numSpan);
    header.appendChild(dragHandle);
    header.appendChild(titleInput);
    header.appendChild(statusSelect);
    header.appendChild(removeBtn);

    // Drag events
    header.addEventListener('dragstart', function () {
      dragSrcId = item.id;
      setTimeout(function () { card.style.opacity = '0.4'; }, 0);
    });
    header.addEventListener('dragend', function () { card.style.opacity = '1'; });
    card.addEventListener('dragover', function (e) {
      e.preventDefault();
      card.style.outline = '2px solid var(--gold)';
    });
    card.addEventListener('dragleave', function () { card.style.outline = ''; });
    card.addEventListener('drop', function (e) {
      e.preventDefault();
      card.style.outline = '';
      if (dragSrcId === item.id) return;
      const fi = agendaItems.findIndex(function (x) { return x.id === dragSrcId; });
      const ti = agendaItems.findIndex(function (x) { return x.id === item.id; });
      if (fi === -1 || ti === -1) return;
      const moved = agendaItems.splice(fi, 1)[0];
      agendaItems.splice(ti, 0, moved);
      renderAgendaItems();
    });

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    // Row 1: Presenter + Time
    const row1 = document.createElement('div');
    row1.className = 'card-row';

    function makeGroup(labelTxt, inputEl) {
      const g = document.createElement('div');
      const lbl = document.createElement('label');
      lbl.className = 'field-label-editor';
      lbl.textContent = labelTxt;
      g.appendChild(lbl);
      g.appendChild(inputEl);
      return g;
    }

    const presInput = document.createElement('input');
    presInput.className = 'input-editor';
    presInput.type = 'text';
    presInput.placeholder = 'Name & role';
    presInput.value = item.presenter;
    presInput.addEventListener('input', function () { item.presenter = this.value; });

    const timeInput = document.createElement('input');
    timeInput.className = 'input-editor';
    timeInput.type = 'text';
    timeInput.placeholder = 'e.g. 15 min';
    timeInput.value = item.timeAlloc || '';
    timeInput.addEventListener('input', function () { item.timeAlloc = this.value; });

    row1.appendChild(makeGroup('Presenter / Owner', presInput));
    row1.appendChild(makeGroup('Time Allocated', timeInput));

    // Discussion
    const discArea = document.createElement('textarea');
    discArea.className = 'input-editor';
    discArea.rows = 3;
    discArea.placeholder = 'Key points discussed…';
    discArea.value = item.discussion;
    discArea.addEventListener('input', function () { item.discussion = this.value; });

    // Decision
    const decArea = document.createElement('textarea');
    decArea.className = 'input-editor';
    decArea.rows = 2;
    decArea.placeholder = 'Decisions made or conclusions reached…';
    decArea.value = item.decision;
    decArea.addEventListener('input', function () { item.decision = this.value; });

    // Action items
    const actionWrap = document.createElement('div');
    actionWrap.className = 'action-items-mini';
    const actionLabel = document.createElement('div');
    actionLabel.className = 'action-items-mini-label';
    actionLabel.textContent = 'Action Items';
    const actionRows = document.createElement('div');
    actionRows.id = 'actions-' + item.id;
    const addActionBtn = document.createElement('button');
    addActionBtn.className = 'btn-add-action';
    addActionBtn.textContent = '+ Add Action Item';
    addActionBtn.addEventListener('click', function () {
      item.actionItems.push({ action: '', responsible: '', deadline: '' });
      renderActionRows(item);
    });
    actionWrap.appendChild(actionLabel);
    actionWrap.appendChild(actionRows);
    actionWrap.appendChild(addActionBtn);

    body.appendChild(row1);
    body.appendChild(makeGroup('Discussion / Notes', discArea));
    body.appendChild(makeGroup('Decision / Outcome', decArea));
    body.appendChild(actionWrap);

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);

    renderActionRows(item);
  });
}

function renderActionRows(item) {
  const wrap = document.getElementById('actions-' + item.id);
  if (!wrap) return;
  wrap.innerHTML = '';
  item.actionItems.forEach(function (ai, aIdx) {
    const row = document.createElement('div');
    row.className = 'action-row';

    const actionIn = document.createElement('input');
    actionIn.className = 'input-editor';
    actionIn.type = 'text';
    actionIn.placeholder = 'Action description';
    actionIn.value = ai.action;
    actionIn.style.cssText = 'font-size:12px;padding:6px 9px;';
    actionIn.addEventListener('input', function () { ai.action = this.value; });

    const respIn = document.createElement('input');
    respIn.className = 'input-editor';
    respIn.type = 'text';
    respIn.placeholder = 'Responsible';
    respIn.value = ai.responsible;
    respIn.style.cssText = 'font-size:12px;padding:6px 9px;';
    respIn.addEventListener('input', function () { ai.responsible = this.value; });

    const deadIn = document.createElement('input');
    deadIn.className = 'input-editor';
    deadIn.type = 'date';
    deadIn.value = ai.deadline;
    deadIn.style.cssText = 'font-size:12px;padding:6px 9px;';
    deadIn.addEventListener('change', function () { ai.deadline = this.value; });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn-icon danger';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = 'Remove';
    removeBtn.style.cssText = 'border-color:rgba(255,255,255,0);background:transparent;color:var(--line2);border-radius:2px;';
    removeBtn.addEventListener('click', function () {
      item.actionItems.splice(aIdx, 1);
      renderActionRows(item);
    });

    row.appendChild(actionIn);
    row.appendChild(respIn);
    row.appendChild(deadIn);
    row.appendChild(removeBtn);
    wrap.appendChild(row);
  });
}

// ── HELPERS ──
function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function formatDate(dateVal) {
  if (!dateVal) return { dayName: '', dateStr: '' };
  const d = new Date(dateVal + 'T12:00:00');
  return {
    dayName: d.toLocaleDateString('en-GB', { weekday: 'long' }),
    dateStr: d.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' })
  };
}

// ── PDF BUILD ──
function buildLogoHtml(size) {
  // size: 'large' (first page header) or 'small' (continuation header)
  if (size === 'large') {
    return logoDataUrl
      ? '<img class="pdf-logo-img" src="' + logoDataUrl + '" alt="Amaar Mining Logo">'
      : '<div class="pdf-logo-placeholder">⬡</div>';
  } else {
    return logoDataUrl
      ? '<img class="pdf-cont-logo-img" src="' + logoDataUrl + '" alt="Amaar Mining Logo">'
      : '<div class="pdf-cont-logo-placeholder">⬡</div>';
  }
}

function buildFirstPageHeader(title, dateVal, timeVal, ref, type, loc, chair, recorder, filledAttendees) {
  const { dayName, dateStr } = formatDate(dateVal);

  const metaCells = [
    { label: 'Meeting Type', value: type || '—' },
    { label: 'Date', value: (dayName ? dayName + ', ' : '') + (dateStr || '—') },
    { label: 'Time', value: timeVal || '—' },
    { label: 'Location', value: loc || '—' },
    { label: 'Chairperson', value: chair || '—' },
    { label: 'Recorded By', value: recorder || '—' },
  ];
  if (ref) metaCells.push({ label: 'Reference No.', value: ref });

  const metaHtml = metaCells.map(function (c) {
    return '<div class="pdf-meta-cell"><div class="pdf-meta-label">' + esc(c.label) + '</div><div class="pdf-meta-value">' + esc(c.value) + '</div></div>';
  }).join('');

  const attHtml = filledAttendees.length > 0
    ? '<div class="pdf-section-heading">Attendees (' + filledAttendees.length + ')</div>'
    + '<div class="pdf-attendees-grid">'
    + filledAttendees.map(function (a) {
      return '<div class="pdf-attendee-item">' + esc(a.name)
        + (a.role ? ' <span style="color:#8A8880;font-size:9px">– ' + esc(a.role) + '</span>' : '')
        + '</div>';
    }).join('')
    + '</div>'
    : '';

  return '<div class="pdf-header">'
    + '<div class="pdf-brand-block">'
    + buildLogoHtml('large')
    + '<div class="pdf-brand-text"><div class="pdf-company-name">Amaar Mining</div><div class="pdf-company-sub">Saudi Arabian Mining</div></div>'
    + '</div>'
    + '<div class="pdf-doc-label">'
    + '<div class="pdf-doc-title">Minutes of Meeting</div>'
    + '<div class="pdf-doc-date">' + esc(dayName) + (dayName ? ', ' : '') + esc(dateStr) + (timeVal ? ' · ' + esc(timeVal) : '') + '</div>'
    + (ref ? '<div class="pdf-doc-ref">Ref: ' + esc(ref) + '</div>' : '')
    + '</div>'
    + '</div>'
    + (title ? '<div class="pdf-meeting-title">' + esc(title) + '</div>' : '')
    + '<div class="pdf-meta-grid">' + metaHtml + '</div>'
    + attHtml;
}

function buildContHeader(dateVal, timeVal, ref, pageNum) {
  const { dayName, dateStr } = formatDate(dateVal);
  return '<div class="pdf-cont-header">'
    + '<div class="pdf-cont-brand">'
    + buildLogoHtml('small')
    + '<div><div class="pdf-cont-name">Amaar Mining</div><div class="pdf-cont-sub">Saudi Arabian Mining</div></div>'
    + '</div>'
    + '<div class="pdf-cont-right">'
    + '<div class="pdf-cont-label">Minutes of Meeting</div>'
    + '<div class="pdf-cont-date">' + esc(dateStr) + (ref ? ' · ' + esc(ref) : '') + (pageNum ? ' · Page ' + pageNum : '') + '</div>'
    + '</div>'
    + '</div>';
}

function buildFooter() {
  return '<div class="pdf-footer">'
    + '<div class="pdf-footer-brand">AMAAR MINING · CONFIDENTIAL</div>'
    + '<div class="pdf-footer-center">This document is intended solely for authorised recipients</div>'
    + '<div>' + new Date().toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' }) + '</div>'
    + '</div>';
}

const statusClass = {
  'Discussed': 'status-discussed', 'Pending': 'status-pending',
  'Deferred': 'status-deferred', 'Approved': 'status-approved',
  'For Information': 'status-info'
};

function buildItemHtml(it, i) {
  const sc = statusClass[it.status] || 'status-info';
  const actHtml = it.actionItems.length
    ? '<div style="margin-top:6px;">'
    + '<div class="pdf-field-label" style="margin-bottom:4px;">Action Items</div>'
    + '<table class="pdf-action-table"><thead><tr>'
    + '<th>Action</th><th>Responsible</th><th>Deadline</th>'
    + '</tr></thead><tbody>'
    + it.actionItems.map(function (ai) {
      const dl = ai.deadline
        ? new Date(ai.deadline + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
        : '—';
      return '<tr><td>' + esc(ai.action || '—') + '</td><td>' + esc(ai.responsible || '—') + '</td><td>' + esc(dl) + '</td></tr>';
    }).join('')
    + '</tbody></table></div>'
    : '';

  return '<div class="pdf-agenda-item">'
    + '<div class="pdf-item-header">'
    + '<span class="pdf-item-num">' + String(i + 1).padStart(2, '0') + '</span>'
    + '<span class="pdf-item-title">' + esc(it.title || 'Untitled Item') + '</span>'
    + '<span class="pdf-item-status ' + sc + '">' + esc(it.status) + '</span>'
    + '</div>'
    + '<div class="pdf-item-body">'
    + ((it.presenter || it.timeAlloc)
      ? '<div class="pdf-item-row">'
      + (it.presenter ? '<div><div class="pdf-field-label">Presenter / Owner</div><div class="pdf-field-value">' + esc(it.presenter) + '</div></div>' : '<div></div>')
      + (it.timeAlloc ? '<div><div class="pdf-field-label">Time Allocated</div><div class="pdf-field-value">' + esc(it.timeAlloc) + '</div></div>' : '<div></div>')
      + '</div>' : '')
    + (it.discussion ? '<div><div class="pdf-field-label">Discussion / Notes</div><div class="pdf-field-value" style="white-space:pre-wrap;">' + esc(it.discussion) + '</div></div>' : '')
    + (it.decision ? '<div><div class="pdf-field-label">Decision / Outcome</div><div class="pdf-field-value" style="font-weight:600;white-space:pre-wrap;">' + esc(it.decision) + '</div></div>' : '')
    + actHtml
    + '</div>'
    + '</div>';
}

function buildPDFHTML() {
  const title    = document.getElementById('mtg-title').value.trim() || 'Meeting Minutes';
  const type     = document.getElementById('mtg-type').value;
  const dateVal  = document.getElementById('mtg-date').value;
  const timeVal  = document.getElementById('mtg-time').value;
  const loc      = document.getElementById('mtg-location').value.trim();
  const ref      = document.getElementById('mtg-ref').value.trim();
  const chair    = document.getElementById('mtg-chair').value.trim();
  const recorder = document.getElementById('mtg-recorder').value.trim();

  const filledAttendees = attendees.filter(function (a) { return a.name.trim(); });
  const filledItems     = agendaItems.filter(function (it) { return it.title.trim() || it.discussion.trim(); });

  // Page 1
  const page1 = '<div class="pdf-page">'
    + buildFirstPageHeader(title, dateVal, timeVal, ref, type, loc, chair, recorder, filledAttendees)
    + '<div class="pdf-section-heading">Agenda Items (' + filledItems.length + ')</div>'
    + (filledItems.length > 0
      ? filledItems.map(function (it, i) { return buildItemHtml(it, i); }).join('')
      : '<p style="font-size:11px;color:#8A8880;font-style:italic;margin:8px 0;">No agenda items recorded.</p>')
    + buildFooter()
    + '</div>';

  return page1;
}

// ── PDF GENERATION ──
function generatePDF() {
  const title = document.getElementById('mtg-title').value.trim() || 'Meeting_Minutes';
  const dateVal = document.getElementById('mtg-date').value;

  const el = document.getElementById('pdf-content');
  el.innerHTML = buildPDFHTML();
  el.style.display = 'block';

  const loading = document.getElementById('loading');
  loading.classList.add('show');

  const safeTitle = title.replace(/[^a-z0-9_\-]/gi, '_');
  const opt = {
    margin: 0,
    filename: safeTitle + '_' + (dateVal || 'minutes') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: {
      scale: 2,
      useCORS: true,
      letterRendering: true,
      allowTaint: true,
      logging: false,
      windowWidth: 794   // 210mm at 96dpi
    },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: '.pdf-agenda-item' }
  };

  html2pdf().set(opt).from(el).save()
    .then(function () {
      el.style.display = 'none';
      loading.classList.remove('show');
      showToast('PDF downloaded successfully ✓');
    })
    .catch(function (err) {
      console.error('PDF error:', err);
      el.style.display = 'none';
      loading.classList.remove('show');
      showToast('Error generating PDF');
    });
}

document.getElementById('btn-generate').addEventListener('click', generatePDF);

// ── CLEAR ──
document.getElementById('btn-clear').addEventListener('click', function () {
  if (!confirm('Clear all data? This cannot be undone.')) return;
  ['mtg-title', 'mtg-location', 'mtg-ref', 'mtg-chair', 'mtg-recorder'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('mtg-type').value = '';
  document.getElementById('mtg-date').valueAsDate = new Date();
  document.getElementById('mtg-time').value = new Date().toTimeString().slice(0, 5);
  attendees = [];
  agendaItems = [];
  logoDataUrl = null;
  attendeeIdCtr = 0;
  itemIdCtr = 0;
  document.getElementById('logo-display').innerHTML = '<div class="brand-logo-placeholder">⬡</div>';
  addAttendee(); addAttendee(); addAttendee();
  renderAttendees();
  renderAgendaItems();
  showToast('Cleared ✓');
});

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2800);
}
