<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amaar Mining – Report Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C8943A;
    --gold-light: #E8B860;
    --gold-dim: #8A6020;
    --dark: #0E0F0F;
    --dark2: #161818;
    --dark3: #1E2020;
    --dark4: #252828;
    --mid: #343838;
    --border: #2E3232;
    --text: #D8DCDC;
    --text-dim: #888E8E;
    --text-muted: #555C5C;
    --white: #F0F4F4;
    --danger: #C04040;
    --success: #3A8A5A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── BUILDER UI ── */
  #builder {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .app-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .app-title span.accent { color: var(--gold); }
  .app-title-sub {
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .company-block {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--gold);
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .company-block h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }
  .company-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media(max-width:600px){ .company-fields { grid-template-columns: 1fr; } }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 7px;
  }
  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .2s;
    resize: vertical;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus, select:focus {
    border-color: var(--gold);
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--text-muted); }

  /* Logo upload */
  .logo-upload-area {
    border: 2px dashed var(--mid);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }
  .logo-upload-area:hover { border-color: var(--gold); background: rgba(200,148,58,.04); }
  .logo-upload-area input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .logo-upload-area img { max-height: 60px; max-width: 100%; object-fit: contain; }
  .logo-upload-label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }
  .logo-upload-label span { color: var(--gold); font-weight: 600; }

  /* Section type badge */
  .section-type-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .badge-text { background: rgba(200,148,58,.15); color: var(--gold); border: 1px solid var(--gold-dim); }
  .badge-table { background: rgba(58,138,90,.15); color: #5EC488; border: 1px solid #2A6040; }

  /* Section cards */
  .sections-container { display: flex; flex-direction: column; gap: 16px; }
  .section-card {
    background: var(--dark2);
    border: 1px solid var(--border);
    position: relative;
    transition: border-color .2s;
  }
  .section-card:hover { border-color: var(--mid); }
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: grab;
    user-select: none;
  }
  .section-header:active { cursor: grabbing; }
  .drag-handle { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }
  .section-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    flex-shrink: 0;
    width: 28px;
  }
  .section-title-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 0;
    outline: none;
    transition: border-color .2s;
  }
  .section-title-input:focus { border-bottom-color: var(--gold); }
  .section-title-input::placeholder { color: var(--text-muted); font-weight: 400; }

  .btn-remove {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    transition: color .2s;
    flex-shrink: 0;
  }
  .btn-remove:hover { color: var(--danger); }

  .section-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* Image upload inside section */
  .img-upload-area {
    border: 1px dashed var(--mid);
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .img-upload-area:hover { border-color: var(--gold-dim); background: rgba(200,148,58,.03); }
  .img-upload-area input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .img-upload-text { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .img-upload-text .icon { font-size: 16px; }
  .img-preview-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .img-thumb-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .img-thumb { width: 64px; height: 48px; object-fit: cover; border: 1px solid var(--border); display: block; }
  .img-caption-input {
    width: 120px;
    font-size: 10px;
    padding: 3px 6px;
    background: var(--dark3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Barlow', sans-serif;
    outline: none;
    resize: none;
    text-align: center;
  }
  .img-caption-input:focus { border-color: var(--gold-dim); }
  .btn-remove-img {
    position: absolute; top: -5px; right: -5px;
    background: var(--danger); color: white; border: none;
    width: 16px; height: 16px; border-radius: 50%; font-size: 10px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }

  /* Table editor */
  .table-editor-wrap { overflow-x: auto; }
  .table-editor {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .table-editor th, .table-editor td {
    border: 1px solid var(--border);
    padding: 0;
    min-width: 90px;
  }
  .table-editor th { background: var(--dark4); }
  .table-editor input.cell-input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
  }
  .table-editor th input.cell-input { font-weight: 700; color: var(--gold); }
  .table-editor input.cell-input:focus { background: rgba(200,148,58,.05); }

  .table-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .btn-table-ctrl {
    background: var(--dark3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 12px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-table-ctrl:hover { border-color: var(--gold-dim); color: var(--gold); }
  .btn-table-ctrl.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* Add section */
  .add-section-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn-add-section {
    flex: 1;
    padding: 14px;
    background: transparent;
    border: 1px dashed var(--mid);
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-add-section:hover { border-color: var(--gold-dim); color: var(--gold); background: rgba(200,148,58,.04); }
  .btn-add-section.table-btn:hover { border-color: #2A6040; color: #5EC488; background: rgba(58,138,90,.04); }

  /* Action bar */
  .action-bar {
    display: flex;
    gap: 12px;
    margin-top: 32px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--dark);
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 32px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-primary:active { transform: scale(.98); }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 13px 22px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--white); }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }

  .divider { height: 1px; background: var(--border); margin: 4px 0; flex: 1; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--dark4); border: 1px solid var(--gold-dim);
    color: var(--gold-light); font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    padding: 12px 24px; z-index: 9999;
    transition: transform .3s ease;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── REPORT PREVIEW OVERLAY ── */
  #report-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 1000;
    overflow-y: auto;
  }
  #report-overlay.show { display: block; }

  .report-toolbar {
    position: sticky;
    top: 0;
    background: var(--dark2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 10;
    flex-wrap: wrap;
  }
  .report-toolbar span {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-right: auto;
  }

  /* ── REPORT DOCUMENT ── */
  #report-doc {
    max-width: 820px;
    margin: 32px auto;
    background: #fff;
    color: #1A1A1A;
    font-family: 'Barlow', sans-serif;
    line-height: 1.7;
  }

  /* Each report page */
  .rep-page {
    background: #fff;
    padding: 60px 70px;
    min-height: 1100px;
    position: relative;
  }
  .rep-page + .rep-page {
    border-top: 4px solid #E8E8E8;
  }

  .rep-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 20px;
    border-bottom: 3px solid #C8943A;
    margin-bottom: 32px;
    gap: 20px;
  }
  .rep-logo-wrap img { max-height: 70px; max-width: 200px; object-fit: contain; }
  .rep-logo-placeholder {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #C8943A;
    text-transform: uppercase;
  }
  .rep-meta { text-align: right; }
  .rep-company-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1A1A1A;
    text-transform: uppercase;
  }
  .rep-report-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #C8943A;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .rep-info-row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid #E8E8E8;
  }
  .rep-info-item label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #999;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }
  .rep-info-item span {
    font-size: 13px;
    font-weight: 500;
    color: #333;
  }

  /* TOC page */
  .rep-toc-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #1A1A1A;
    padding-bottom: 12px;
    border-bottom: 3px solid #C8943A;
    margin-bottom: 28px;
  }
  .rep-toc-list { list-style: none; }
  .rep-toc-list li {
    display: flex;
    align-items: baseline;
    gap: 0;
    padding: 9px 0;
    border-bottom: 1px dotted #E0E0E0;
  }
  .rep-toc-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #C8943A;
    letter-spacing: 2px;
    min-width: 44px;
    flex-shrink: 0;
  }
  .rep-toc-name {
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #333;
    flex: 1;
  }
  .rep-toc-type {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 2px 6px;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .rep-toc-type.text { background: #FFF5E5; color: #C8943A; border: 1px solid #F0D8A8; }
  .rep-toc-type.table { background: #E5FFF0; color: #2A8050; border: 1px solid #A0D8B8; }

  /* Section */
  .rep-section { margin-bottom: 40px; }
  .rep-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #1A1A1A;
    padding-bottom: 8px;
    border-bottom: 2px solid #C8943A;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rep-section-num {
    font-size: 11px;
    font-weight: 700;
    color: #C8943A;
    letter-spacing: 2px;
    min-width: 28px;
  }
  .rep-section-body {
    font-size: 14px;
    color: #333;
    text-align: justify;
    white-space: pre-wrap;
    line-height: 1.8;
  }
  .rep-section-images {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 16px;
  }
  .rep-figure {
    flex: 1 1 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .rep-figure img {
    max-width: 100%;
    max-height: 320px;
    object-fit: contain;
    border: 1px solid #E8E8E8;
    width: 100%;
  }
  .rep-figure-caption {
    font-size: 11px;
    font-style: italic;
    color: #888;
    text-align: center;
    line-height: 1.4;
  }
  .rep-figure-num {
    font-weight: 700;
    color: #C8943A;
    font-style: normal;
  }

  /* Report table */
  .rep-table-wrap { overflow-x: auto; margin-top: 12px; }
  .rep-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  .rep-table th {
    background: #C8943A;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 9px 14px;
    text-align: left;
    border: 1px solid #A87030;
  }
  .rep-table td {
    padding: 8px 14px;
    border: 1px solid #E8E8E8;
    color: #333;
    vertical-align: top;
  }
  .rep-table tr:nth-child(even) td { background: #FAFAFA; }
  .rep-table tr:hover td { background: #FFF8EE; }

  /* Footer */
  .rep-footer {
    border-top: 1px solid #E8E8E8;
    padding-top: 16px;
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #AAA;
    letter-spacing: 1px;
  }
  .rep-confidential {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #C8943A;
    opacity: .6;
  }

  /* PDF progress */
  #pdf-progress {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(14,15,15,.92);
    z-index: 2000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #pdf-progress.show { display: flex; }
  .pdf-progress-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .pdf-progress-bar-wrap {
    width: 280px;
    height: 3px;
    background: var(--border);
  }
  .pdf-progress-bar {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width .3s ease;
  }

  @media print {
    #report-overlay { position: static; background: none; overflow: visible; }
    .report-toolbar { display: none !important; }
    #report-doc { margin: 0; box-shadow: none; max-width: 100%; }
    .rep-page { padding: 40px; min-height: auto; }
    body > #builder { display: none; }
  }
</style>
</head>
<body>

<!-- ══ BUILDER ══ -->
<div id="builder">
  <header class="app-header">
    <div>
      <div class="app-title">
        <span class="accent">▲</span>
        <div>
          <div>Amaar <span class="accent">Mining</span></div>
          <div class="app-title-sub">Report Generator</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Company block -->
  <div class="company-block">
    <h2>Report Identity</h2>
    <div class="company-fields">
      <div>
        <label>Company / Project Name</label>
        <input type="text" id="field-company" placeholder="e.g. Amaar Mining Co." value="Amaar Mining">
      </div>
      <div>
        <label>Report Title</label>
        <input type="text" id="field-title" placeholder="e.g. Relinquishment Report 2024">
      </div>
      <div>
        <label>Prepared By</label>
        <input type="text" id="field-author" placeholder="Author name & role">
      </div>
      <div>
        <label>Report Date</label>
        <input type="date" id="field-date">
      </div>
      <div>
        <label>Reference / License No.</label>
        <input type="text" id="field-ref" placeholder="e.g. EL-2024-0087">
      </div>
      <div>
        <label>Company Logo (optional)</label>
        <div class="logo-upload-area" id="logo-drop">
          <input type="file" id="logo-input" accept="image/*">
          <div id="logo-preview-wrap">
            <div class="logo-upload-label">↑ <span>Upload logo</span> · any format</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sections -->
  <div class="sections-container" id="sections-container"></div>

  <!-- Add section buttons -->
  <div class="add-section-row">
    <button class="btn-add-section" id="btn-add-text">+ Add Text Section</button>
    <button class="btn-add-section table-btn" id="btn-add-table">⊞ Add Table Section</button>
  </div>

  <!-- Actions -->
  <div class="action-bar">
    <button class="btn-primary" id="btn-generate">⊞ Create Report</button>
    <div class="divider"></div>
    <button class="btn-ghost" id="btn-reset">Clear All</button>
  </div>
</div>

<!-- ══ REPORT OVERLAY ══ -->
<div id="report-overlay">
  <div class="report-toolbar">
    <span>Report Preview</span>
    <button class="btn-ghost" id="btn-pdf">⬇ Download PDF</button>
    <button class="btn-primary" id="btn-close-report">✕ Close</button>
  </div>
  <div id="report-doc"></div>
</div>

<!-- ══ PDF PROGRESS ══ -->
<div id="pdf-progress">
  <div class="pdf-progress-text" id="pdf-progress-text">Generating PDF…</div>
  <div class="pdf-progress-bar-wrap"><div class="pdf-progress-bar" id="pdf-progress-bar"></div></div>
</div>

<div id="toast"></div>

<!-- libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ── State ──
let sections = [];
let logoDataUrl = null;
let sectionIdCounter = 0;
let globalFigureCounter = 0;

// ── Init ──
document.getElementById('field-date').valueAsDate = new Date();
addSection('Executive Summary', 'text');
addSection('Regional Geology', 'text');
addSection('Exploration Results', 'text');

// ── Logo upload ──
document.getElementById('logo-input').addEventListener('change', function(){
  if(!this.files[0]) return;
  const fr = new FileReader();
  fr.onload = e => {
    logoDataUrl = e.target.result;
    const wrap = document.getElementById('logo-preview-wrap');
    wrap.innerHTML = `<img src="${logoDataUrl}" alt="logo">`;
  };
  fr.readAsDataURL(this.files[0]);
});

// ── Add section ──
document.getElementById('btn-add-text').addEventListener('click', () => addSection('', 'text'));
document.getElementById('btn-add-table').addEventListener('click', () => addSection('', 'table'));

function addSection(defaultTitle='', type='text') {
  const id = ++sectionIdCounter;
  const sec = { id, title: defaultTitle, type, content: '', images: [] };
  if(type === 'table') {
    sec.tableData = {
      headers: ['Column 1', 'Column 2', 'Column 3'],
      rows: [
        ['', '', ''],
        ['', '', ''],
        ['', '', '']
      ]
    };
  }
  sections.push(sec);
  renderSections();
}

// ── Render sections ──
function renderSections(){
  const container = document.getElementById('sections-container');
  container.innerHTML = '';
  sections.forEach((sec, idx) => {
    const card = document.createElement('div');
    card.className = 'section-card';
    card.dataset.id = sec.id;

    const badgeClass = sec.type === 'table' ? 'badge-table' : 'badge-text';
    const badgeLabel = sec.type === 'table' ? 'Table' : 'Text';

    let bodyHtml = '';
    if(sec.type === 'text') {
      bodyHtml = `
        <div class="section-body">
          <div>
            <label>Content</label>
            <textarea rows="5" placeholder="Write section content here… (leave blank to exclude)" data-field="content" data-id="${sec.id}">${escHtml(sec.content)}</textarea>
          </div>
          <div>
            <label>Images <span style="color:var(--text-muted);font-weight:400;font-size:10px;letter-spacing:0">(optional captions per image)</span></label>
            <div class="img-upload-area">
              <input type="file" accept="image/*" multiple data-id="${sec.id}" class="img-file-input">
              <div class="img-upload-text"><span class="icon">🖼</span> Upload images · any size & format</div>
            </div>
            <div class="img-preview-strip" id="preview-${sec.id}"></div>
          </div>
        </div>
      `;
    } else {
      // table type
      bodyHtml = buildTableEditorHtml(sec);
    }

    card.innerHTML = `
      <div class="section-header" draggable="true">
        <span class="drag-handle">⠿</span>
        <span class="section-num">${String(idx+1).padStart(2,'0')}</span>
        <input class="section-title-input" type="text" placeholder="Section Title (optional)" value="${escHtml(sec.title)}" data-field="title" data-id="${sec.id}">
        <span class="section-type-badge ${badgeClass}">${badgeLabel}</span>
        <button class="btn-remove" data-id="${sec.id}" title="Remove section">×</button>
      </div>
      ${bodyHtml}
    `;
    container.appendChild(card);

    // Restore images preview for text sections
    if(sec.type === 'text') {
      const strip = document.getElementById(`preview-${sec.id}`);
      sec.images.forEach((img, iIdx) => addThumb(strip, img.url, img.caption || '', sec.id, iIdx));
    }
  });
  bindEvents();
}

function buildTableEditorHtml(sec) {
  const td = sec.tableData;
  let headerCells = td.headers.map((h,ci) =>
    `<th><input class="cell-input" type="text" value="${escHtml(h)}" data-role="header" data-id="${sec.id}" data-col="${ci}" placeholder="Header ${ci+1}"></th>`
  ).join('');
  let bodyRows = td.rows.map((row, ri) => {
    let cells = row.map((cell, ci) =>
      `<td><input class="cell-input" type="text" value="${escHtml(cell)}" data-role="cell" data-id="${sec.id}" data-row="${ri}" data-col="${ci}" placeholder="…"></td>`
    ).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  return `
    <div class="section-body">
      <div class="table-editor-wrap">
        <table class="table-editor">
          <thead><tr>${headerCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <div class="table-controls">
        <button class="btn-table-ctrl" data-action="add-col" data-id="${sec.id}">+ Column</button>
        <button class="btn-table-ctrl" data-action="add-row" data-id="${sec.id}">+ Row</button>
        <button class="btn-table-ctrl danger" data-action="del-col" data-id="${sec.id}">− Column</button>
        <button class="btn-table-ctrl danger" data-action="del-row" data-id="${sec.id}">− Row</button>
      </div>
    </div>
  `;
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Bind events ──
function bindEvents(){
  // Title change
  document.querySelectorAll('[data-field="title"]').forEach(el => {
    el.addEventListener('input', e => {
      const id = +e.target.dataset.id;
      const sec = sections.find(s=>s.id===id);
      if(sec) sec.title = e.target.value;
    });
  });

  // Content change (text sections)
  document.querySelectorAll('[data-field="content"]').forEach(el => {
    el.addEventListener('input', e => {
      const id = +e.target.dataset.id;
      const sec = sections.find(s=>s.id===id);
      if(sec) sec.content = e.target.value;
    });
  });

  // Table cell edits
  document.querySelectorAll('.cell-input').forEach(el => {
    el.addEventListener('input', e => {
      const id = +e.target.dataset.id;
      const sec = sections.find(s=>s.id===id);
      if(!sec) return;
      if(e.target.dataset.role === 'header') {
        sec.tableData.headers[+e.target.dataset.col] = e.target.value;
      } else {
        sec.tableData.rows[+e.target.dataset.row][+e.target.dataset.col] = e.target.value;
      }
    });
  });

  // Table controls
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = +e.target.dataset.id;
      const sec = sections.find(s=>s.id===id);
      if(!sec) return;
      const action = e.target.dataset.action;
      const td = sec.tableData;
      if(action === 'add-col') {
        td.headers.push(`Column ${td.headers.length+1}`);
        td.rows.forEach(r=>r.push(''));
      } else if(action === 'add-row') {
        td.rows.push(td.headers.map(()=>''));
      } else if(action === 'del-col') {
        if(td.headers.length > 1){ td.headers.pop(); td.rows.forEach(r=>r.pop()); }
      } else if(action === 'del-row') {
        if(td.rows.length > 1) td.rows.pop();
      }
      renderSections();
    });
  });

  // Remove section
  document.querySelectorAll('.btn-remove').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = +e.currentTarget.dataset.id;
      sections = sections.filter(s=>s.id!==id);
      renderSections();
    });
  });

  // Image upload
  document.querySelectorAll('.img-file-input').forEach(input => {
    input.addEventListener('change', function(){
      const id = +this.dataset.id;
      const sec = sections.find(s=>s.id===id);
      const strip = document.getElementById(`preview-${id}`);
      Array.from(this.files).forEach(file => {
        const fr = new FileReader();
        fr.onload = e2 => {
          const idx = sec.images.length;
          sec.images.push({ url: e2.target.result, name: file.name, caption: '' });
          addThumb(strip, e2.target.result, '', id, idx);
        };
        fr.readAsDataURL(file);
      });
      this.value = '';
    });
  });

  // Drag-and-drop reorder
  let dragSrcId = null;
  document.querySelectorAll('.section-card').forEach(card => {
    const header = card.querySelector('.section-header');
    header.addEventListener('dragstart', () => { dragSrcId = +card.dataset.id; card.style.opacity='.4'; });
    header.addEventListener('dragend', () => { card.style.opacity='1'; });
    card.addEventListener('dragover', e => { e.preventDefault(); card.style.borderColor='var(--gold)'; });
    card.addEventListener('dragleave', () => { card.style.borderColor=''; });
    card.addEventListener('drop', e => {
      e.preventDefault(); card.style.borderColor='';
      const targetId = +card.dataset.id;
      if(dragSrcId===targetId) return;
      const from = sections.findIndex(s=>s.id===dragSrcId);
      const to   = sections.findIndex(s=>s.id===targetId);
      const [item] = sections.splice(from,1);
      sections.splice(to,0,item);
      renderSections();
    });
  });
}

function addThumb(strip, url, caption, secId, iIdx){
  const wrap = document.createElement('div');
  wrap.className = 'img-thumb-wrap';
  wrap.innerHTML = `
    <img class="img-thumb" src="${url}" alt="img">
    <button class="btn-remove-img" data-sid="${secId}" data-iidx="${iIdx}" title="Remove">×</button>
    <input class="img-caption-input" type="text" placeholder="Caption (optional)" value="${escHtml(caption)}" data-sid="${secId}" data-iidx="${iIdx}">
  `;
  // caption sync
  wrap.querySelector('.img-caption-input').addEventListener('input', e => {
    const sid = +e.target.dataset.sid;
    const sec = sections.find(s=>s.id===sid);
    if(sec && sec.images[iIdx]) sec.images[iIdx].caption = e.target.value;
  });
  wrap.querySelector('.btn-remove-img').addEventListener('click', e => {
    const sid = +e.target.dataset.sid;
    const sec = sections.find(s=>s.id===sid);
    sec.images.splice(iIdx,1);
    renderSections();
  });
  strip.appendChild(wrap);
}

// ── Generate Report ──
document.getElementById('btn-generate').addEventListener('click', () => {
  const company = document.getElementById('field-company').value.trim() || 'Amaar Mining';
  const title   = document.getElementById('field-title').value.trim() || 'Exploration Report';
  const author  = document.getElementById('field-author').value.trim();
  const date    = document.getElementById('field-date').value;
  const ref     = document.getElementById('field-ref').value.trim();

  const filled = sections.filter(s =>
    s.title.trim() || s.content.trim() || s.images.length > 0 ||
    (s.type === 'table' && (s.tableData.headers.some(h=>h.trim()) || s.tableData.rows.some(r=>r.some(c=>c.trim()))))
  );

  const dateStr = date ? new Date(date).toLocaleDateString('en-GB', {year:'numeric',month:'long',day:'numeric'}) : '';

  // Build logo HTML
  const logoHtml = logoDataUrl
    ? `<div class="rep-logo-wrap"><img src="${logoDataUrl}" alt="logo"></div>`
    : `<div class="rep-logo-placeholder">▲ ${escHtml(company)}</div>`;

  // Build common header
  function pageHeader() {
    return `
      <div class="rep-header">
        ${logoHtml}
        <div class="rep-meta">
          <div class="rep-company-name">${escHtml(company)}</div>
          <div class="rep-report-title">${escHtml(title)}</div>
        </div>
      </div>
    `;
  }

  function pageFooter(pageNum) {
    return `
      <div class="rep-footer">
        <div class="rep-confidential">Confidential · ${escHtml(company)}</div>
        <div>${dateStr || ''} &nbsp;&nbsp; Page ${pageNum}</div>
      </div>
    `;
  }

  // ── Page 1: Cover ──
  let metaRows = '';
  if(author) metaRows += `<div class="rep-info-item"><label>Prepared By</label><span>${escHtml(author)}</span></div>`;
  if(dateStr) metaRows += `<div class="rep-info-item"><label>Date</label><span>${dateStr}</span></div>`;
  if(ref) metaRows += `<div class="rep-info-item"><label>Reference</label><span>${escHtml(ref)}</span></div>`;
  if(filled.length) metaRows += `<div class="rep-info-item"><label>Sections</label><span>${filled.length}</span></div>`;

  const page1 = `
    <div class="rep-page" id="rep-page-1">
      ${pageHeader()}
      ${metaRows ? `<div class="rep-info-row">${metaRows}</div>` : ''}
      ${pageFooter(1)}
    </div>
  `;

  // ── Page 2: TOC ──
  let tocItems = filled.map((sec, i) => {
    const secTitle = sec.title.trim() || `Section ${i+1}`;
    const typeLabel = sec.type === 'table' ? 'table' : 'text';
    const typeCls   = sec.type === 'table' ? 'table' : 'text';
    return `
      <li>
        <span class="rep-toc-num">${String(i+1).padStart(2,'0')}</span>
        <span class="rep-toc-name">${escHtml(secTitle)}</span>
        <span class="rep-toc-type ${typeCls}">${typeLabel}</span>
      </li>
    `;
  }).join('');

  const page2 = `
    <div class="rep-page" id="rep-page-2">
      ${pageHeader()}
      <div class="rep-toc-title">Table of Contents</div>
      <ul class="rep-toc-list">${tocItems}</ul>
      ${pageFooter(2)}
    </div>
  `;

  // ── Content pages ──
  let figureCount = 0;
  let contentPages = '';
  filled.forEach((sec, i) => {
    const secTitle = sec.title.trim() || `Section ${i+1}`;

    let sectionContent = '';
    if(sec.type === 'text') {
      const bodyHtml = sec.content.trim()
        ? `<div class="rep-section-body">${escHtml(sec.content)}</div>` : '';

      let imgsHtml = '';
      if(sec.images.length) {
        const figureItems = sec.images.map(img => {
          figureCount++;
          const captionLine = img.caption
            ? `<span class="rep-figure-num">Figure ${figureCount}:</span> ${escHtml(img.caption)}`
            : `<span class="rep-figure-num">Figure ${figureCount}</span>`;
          return `
            <div class="rep-figure">
              <img src="${img.url}" alt="Figure ${figureCount}">
              <div class="rep-figure-caption">${captionLine}</div>
            </div>
          `;
        }).join('');
        imgsHtml = `<div class="rep-section-images">${figureItems}</div>`;
      }
      sectionContent = bodyHtml + imgsHtml;
    } else {
      // table
      const td = sec.tableData;
      const headerCells = td.headers.map(h => `<th>${escHtml(h)}</th>`).join('');
      const bodyRows = td.rows.map(row =>
        `<tr>${row.map(cell=>`<td>${escHtml(cell)}</td>`).join('')}</tr>`
      ).join('');
      sectionContent = `
        <div class="rep-table-wrap">
          <table class="rep-table">
            <thead><tr>${headerCells}</tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      `;
    }

    contentPages += `
      <div class="rep-page" id="rep-section-${i+1}">
        ${pageHeader()}
        <div class="rep-section">
          <div class="rep-section-title">
            <span class="rep-section-num">${String(i+1).padStart(2,'0')}</span>
            ${escHtml(secTitle)}
          </div>
          ${sectionContent}
        </div>
        ${pageFooter(i+3)}
      </div>
    `;
  });

  const html = page1 + page2 + contentPages;
  document.getElementById('report-doc').innerHTML = html;
  document.getElementById('report-overlay').classList.add('show');
  showToast('Report ready — preview below');
});

// ── Close report ──
document.getElementById('btn-close-report').addEventListener('click', () => {
  document.getElementById('report-overlay').classList.remove('show');
});

// ── PDF Download ──
document.getElementById('btn-pdf').addEventListener('click', async () => {
  const { jsPDF } = window.jspdf;
  const pages = document.querySelectorAll('#report-doc .rep-page');
  if(!pages.length) { showToast('No pages to export'); return; }

  const title = document.getElementById('field-title').value.trim() || 'Report';
  const safeTitle = title.replace(/[^a-z0-9_-]/gi,'_');

  showProgress(true, 0, 'Preparing…');

  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const A4W = 210, A4H = 297;

  for(let i = 0; i < pages.length; i++) {
    const page = pages[i];
    const pct = Math.round(((i+1)/pages.length)*100);
    setProgress(Math.round((i/pages.length)*90), `Rendering page ${i+1} of ${pages.length}…`);
    await new Promise(r => setTimeout(r, 50));

    const canvas = await html2canvas(page, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false
    });

    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const canvasW = canvas.width;
    const canvasH = canvas.height;
    const ratio = canvasH / canvasW;
    const pdfH = Math.min(A4W * ratio, A4H * 3); // allow tall pages

    if(i > 0) pdf.addPage([A4W, pdfH], 'portrait');
    else {
      // re-init first page size
      pdf.internal.pageSize.width = A4W;
      pdf.internal.pageSize.height = pdfH;
    }

    pdf.addImage(imgData, 'JPEG', 0, 0, A4W, pdfH);
  }

  setProgress(98, 'Saving…');
  await new Promise(r => setTimeout(r, 200));
  pdf.save(`${safeTitle}.pdf`);
  showProgress(false);
  showToast('PDF downloaded!');
});

function showProgress(show, pct=0, msg='') {
  const el = document.getElementById('pdf-progress');
  if(show) {
    el.classList.add('show');
    setProgress(pct, msg);
  } else {
    el.classList.remove('show');
  }
}
function setProgress(pct, msg) {
  document.getElementById('pdf-progress-bar').style.width = pct + '%';
  if(msg) document.getElementById('pdf-progress-text').textContent = msg;
}

// ── Reset ──
document.getElementById('btn-reset').addEventListener('click', () => {
  if(!confirm('Clear all sections and inputs?')) return;
  sections = [];
  logoDataUrl = null;
  document.getElementById('logo-preview-wrap').innerHTML = `<div class="logo-upload-label">↑ <span>Upload logo</span> · any format</div>`;
  ['field-company','field-title','field-author','field-ref'].forEach(id => document.getElementById(id).value='');
  document.getElementById('field-date').valueAsDate = new Date();
  addSection('Executive Summary', 'text');
  addSection('Regional Geology', 'text');
  addSection('Exploration Results', 'text');
});

// ── Toast ──
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
